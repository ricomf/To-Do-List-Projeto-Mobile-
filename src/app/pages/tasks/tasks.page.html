<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Minhas Tarefas</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="filter" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchQuery"
      (ionInput)="onSearchChange($event)"
      placeholder="Buscar tarefas..."
      debounce="300"
    ></ion-searchbar>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [(ngModel)]="selectedSegment" (ionChange)="onSegmentChange($event)">
      <ion-segment-button value="all">
        <ion-label>Todas</ion-label>
      </ion-segment-button>
      <ion-segment-button value="todo">
        <ion-label>A Fazer</ion-label>
      </ion-segment-button>
      <ion-segment-button value="inprogress">
        <ion-label>Em Andamento</ion-label>
      </ion-segment-button>
      <ion-segment-button value="completed">
        <ion-label>Concluídas</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Tasks List -->
  <ion-list *ngIf="filteredTasks.length > 0">
    <ion-item-sliding *ngFor="let task of filteredTasks">
      <ion-item [class.completed]="task.status === 'COMPLETED'">
        <ion-checkbox
          slot="start"
          [checked]="task.status === 'COMPLETED'"
          (ionChange)="toggleTaskStatus(task)"
        ></ion-checkbox>

        <ion-label class="ion-text-wrap">
          <h2 [class.task-completed]="task.status === 'COMPLETED'">{{ task.titulo }}</h2>
          <p *ngIf="task.descricao">{{ task.descricao }}</p>
          <div class="task-meta">
            <ion-chip [color]="getPriorityColor(task.prioridade)">
              <ion-label>{{ getPriorityLabel(task.prioridade) }}</ion-label>
            </ion-chip>
            <ion-badge *ngIf="task.dataVencimento" color="medium">
              {{ formatDate(task.dataVencimento) }}
            </ion-badge>
            <ion-badge *ngFor="let tag of task.tags" color="tertiary">
              {{ tag }}
            </ion-badge>
          </div>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="editTask(task)">
          <ion-icon name="create" slot="icon-only"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="deleteTask(task)">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="filteredTasks.length === 0 && !isLoading">
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    <h2>Nenhuma tarefa encontrada</h2>
    <p *ngIf="searchQuery">Tente buscar por outro termo</p>
    <p *ngIf="!searchQuery">Comece criando sua primeira tarefa!</p>
  </div>

  <!-- Floating Action Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createNewTask()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
